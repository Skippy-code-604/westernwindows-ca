<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Western Windows Portal — Sign In</title>
  <link rel="stylesheet" href="/portal/css/styles.css?v=2">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="/portal/ww-logo.png" alt="Western Windows" class="login-logo">
        <h1 class="login-title">Western Windows</h1>
        <p class="login-subtitle">Supplier Portal</p>
      </div>

      <div id="login-loading" style="text-align:center; padding: 20px;">
        <p style="color: var(--text-muted);">Checking authentication...</p>
      </div>

      <div id="login-content" style="display:none;">
        <button type="button" class="btn btn-primary" id="google-signin-btn"
          style="width:100%; padding: 14px; font-size: 15px; display:flex; align-items:center; justify-content:center; gap:10px;">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Sign in with Google
        </button>

        <p id="login-error" class="login-error hidden" style="margin-top: 12px;">
          Access denied. Please try again.
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="/portal/js/firebase-auth.js"></script>
  <script type="module">
    async function init() {
      // Wait for firebase-auth module to set window.firebaseAuth
      let attempts = 0;
      while (!window.firebaseAuth && attempts < 50) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }

      if (!window.firebaseAuth) {
        document.getElementById('login-loading').style.display = 'none';
        document.getElementById('login-content').style.display = 'block';
        return;
      }

      // Check if already signed in
      const user = await window.firebaseAuth.isSignedIn();
      if (user) {
        window.location.href = '/portal/dashboard.html';
        return;
      }

      // Show login button
      document.getElementById('login-loading').style.display = 'none';
      document.getElementById('login-content').style.display = 'block';
    }

    init();

    // Google sign-in button
    document.getElementById('google-signin-btn').addEventListener('click', async () => {
      const errorEl = document.getElementById('login-error');
      errorEl.classList.add('hidden');
      try {
        await window.firebaseAuth.signInWithGoogle();
        window.location.href = '/portal/dashboard.html';
      } catch (err) {
        console.error('Sign-in failed:', err);
        errorEl.textContent = err.message || 'Sign-in failed. Please try again.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>

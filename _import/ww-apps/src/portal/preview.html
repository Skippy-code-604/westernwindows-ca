<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Windows Portal — Preview</title>
    <link rel="stylesheet" href="/portal/css/styles.css?v=2">
</head>

<body>
    <div class="app-container">
        <nav class="navbar">
            <a href="/portal/dashboard.html" class="navbar-brand">
                <img src="/portal/ww-logo.png" alt="Western Windows" class="navbar-logo">
                <div class="navbar-title">WESTERN WINDOWS <span>Portal</span></div>
            </a>
            <div class="navbar-actions">
                <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
            </div>
        </nav>

        <div class="page-content">
            <a href="#" class="back-link" id="back-link">← Back to Form</a>

            <div class="page-header flex-between">
                <div>
                    <h1 class="page-title" id="page-title">Preview Document</h1>
                    <p class="page-subtitle" id="page-subtitle">Review before sending</p>
                </div>
                <div class="flex gap-1">
                    <span class="badge" id="doc-type-badge"></span>
                    <span class="badge" id="doc-status-badge"></span>
                </div>
            </div>

            <!-- PDF Preview -->
            <div class="card mb-2">
                <div class="pdf-preview-container">
                    <iframe id="pdf-preview" title="PDF Preview"></iframe>
                </div>
            </div>

            <!-- Quote Attachments (PO only, shown dynamically) -->
            <div class="card mb-2" id="preview-attachments-section" style="display:none;">
                <h3 class="section-header">📎 Manufacturer Quote Attachments</h3>
                <div class="attachment-dropzone" id="attachment-dropzone">
                    <div class="attachment-dropzone-content">
                        <span class="attachment-dropzone-icon">📎</span>
                        <span class="attachment-dropzone-text">Drag & drop quote files here, or <strong>click to browse</strong></span>
                        <span class="attachment-dropzone-hint">PDF, JPG, PNG — max 10 MB per file</span>
                    </div>
                    <input type="file" id="attachment-input" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none;">
                </div>
                <div id="attachment-list" class="attachment-list"></div>
                <div id="attachment-uploading" class="attachment-uploading" style="display:none;">
                    <div class="attachment-progress-bar"><div class="attachment-progress-fill" id="attachment-progress-fill"></div></div>
                    <span class="attachment-progress-text" id="attachment-progress-text">Uploading...</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="card">
                <h3 class="section-header">Actions</h3>
                <div id="send-info" class="mb-2 text-sm text-muted"></div>
                <div class="flex gap-1" style="flex-wrap: wrap;">
                    <button class="btn btn-outline" id="edit-btn">✏️ Edit</button>
                    <button class="btn btn-primary" id="download-btn">📄 Download PDF</button>
                    <button class="btn btn-accent" id="send-btn">📧 Send to Supplier</button>
                </div>
                <div id="send-result" class="mt-2 hidden"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script type="module" src="/portal/js/firebase-auth.js"></script>
    <script type="module" src="/portal/js/attachments.js"></script>
    <script src="/portal/js/utils.js"></script>
    <script src="/portal/js/preview.js"></script>
</body>

</html>

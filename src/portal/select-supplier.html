<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Windows Portal — Select Supplier</title>
    <link rel="stylesheet" href="/portal/css/styles.css">
</head>

<body>
    <div class="app-container">
        <nav class="navbar">
            <a href="/portal/dashboard.html" class="navbar-brand">
                <img src="/portal/ww-logo.png" alt="Western Windows" class="navbar-logo">
                <div class="navbar-title">WESTERN WINDOWS <span>Portal</span></div>
            </a>
            <div class="navbar-actions">
                <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
            </div>
        </nav>

        <div class="page-content">
            <a href="/portal/dashboard.html" class="back-link">← Back to Dashboard</a>

            <div class="page-header">
                <h1 class="page-title" id="page-title">Select Supplier</h1>
                <p class="page-subtitle" id="page-subtitle">Choose which supplier this is for</p>
            </div>

            <!-- Glass Suppliers -->
            <h2 class="section-header">🪟 Glass Suppliers</h2>
            <div class="supplier-grid" id="glass-suppliers"></div>

            <!-- Window Suppliers -->
            <h2 class="section-header mt-3">🏠 Window & Door Suppliers</h2>
            <div class="supplier-grid" id="window-suppliers"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script type="module" src="/portal/js/firebase-auth.js"></script>
    <script src="/portal/js/utils.js"></script>
    <script src="/portal/js/supplier.js"></script>
</body>

</html>
